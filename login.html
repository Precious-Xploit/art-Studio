<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
            body{
                background-image: url(./images/beautiful-shot-rocky-mountains-with-starry-night-sky-background.jpg);
                padding: 0;
                margin: 0;
                align-items: center;
                box-sizing: border-box;
                background-size: cover;
                display: flex;
                justify-content: center;
                background-repeat: no-repeat;
                height: 100vh;
                font-family: Arial, Helvetica, sans-serif;
            }

            .container{
                display: flex;
                width: 600px;
                height: 300px;
                background: white;
                overflow: hidden;
                border-radius: 8px;
                box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            }
            
            .left_container{
                flex: 1;
                background: url(./images/laptop.jpg);
                display: flex;
                flex-direction: column;
                color: white;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 30px;
                background-color: rgba(0, 0, 0,0.6);
                background-blend-mode: darken;  
            }

            .left_container h1{
                margin-bottom: 10px;
            }

            .right_container{
                flex: 1;
                display: flex;
                flex-direction: column;
                padding: 40px;
                justify-content: center;
            }

            .right_container h1{
                text-align: center;
                margin-bottom: 20px;
            }

            form{
                display: flex;
                flex-direction: column;
            }

            input{
                margin-bottom: 15px;
                padding: 10px;
                font-size: 14px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            button{
                padding: 10px;
                background: rgb(34, 119, 159);
                color: white;
                border: none;
                margin-top: 10px;
                border-radius: 4px;
                cursor: pointer;
                font-size: 15px;
            }

            button:hover{
                background: #5ebade;
            }

            .forgotten{
                text-align: center;
                margin-bottom: 15px;
                font-size: 13px;
                text-decoration: none;
                color: #0ba4e0;
            }

            form p{
                font-size: 13px;
                text-align: left;
            }

        </style>
</head>
<body>
    <div class="container">
            <div class="left_container"> 
                <h1>Welcome back</h1>
                <p>Please login using your personal information</p>
            </div>

            <div class="right_container">
                <h1>Login</h1>
                <form>
                    <label for="">
                        <input type="email" name="email" id="email" placeholder="Email">
                        <input type="password" name="password" id="password" placeholder="password">
                        <a href="#" class="forgotten">Forgotten password?</a><br>
                        <button type="submit">Log in</button>
                        <p>Don't have an account?<a href="#" style="text-decoration: none;">Sign Up</a></p>
                </label>
            </form>
            </div>
        </div>
</body>
</html>
